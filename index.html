<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>для дашеньки 💖</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 50%, #2b0a3d, #0a0014 80%);
    font-family: 'Georgia', serif;
    overflow: hidden;
    position: relative;
  }

  /* летящие сердечки на фоне */
  .heart-bg {
    position: absolute;
    color: rgba(255, 105, 180, 0.35);
    font-size: 22px;
    animation: floatUp linear infinite;
    pointer-events: none;
    user-select: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(100vh) scale(0.5) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-10vh) scale(1.2) rotate(360deg);
      opacity: 0;
    }
  }

  /* кнопка */
  #loveBtn {
    padding: 18px 42px;
    font-size: 20px;
    font-family: 'Georgia', serif;
    color: #fff;
    background: linear-gradient(135deg, #ff4d8d, #b3005e);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 77, 141, 0.7),
                inset 0 0 12px rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
    letter-spacing: 1px;
    z-index: 10;
    position: relative;
    text-transform: lowercase;
  }

  #loveBtn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 45px rgba(255, 77, 141, 1),
                inset 0 0 18px rgba(255, 255, 255, 0.5);
  }

  #loveBtn:active {
    transform: scale(0.95);
  }

  #loveBtn.hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.5);
  }

  /* контейнер для надписей */
  .messages {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    width: 95vw;
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }

  /* общий стиль надписей */
  .message {
    text-align: center;
    font-weight: bold;
    letter-spacing: 3px;
    white-space: nowrap;
    line-height: 1.2;
    text-transform: lowercase;
  }

  /* первая надпись — большая */
  #message1 {
    font-size: clamp(24px, 5.5vw, 62px);
    background: linear-gradient(90deg, #ff5fa2, #ffd1dc, #ff5fa2);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.9))
            drop-shadow(0 0 35px rgba(255, 20, 147, 0.6));
  }

  /* вторая надпись — поменьше и чуть другого оттенка */
  #message2 {
    font-size: clamp(16px, 3.2vw, 38px);
    background: linear-gradient(90deg, #ff9ec7, #fff0f5, #ff9ec7);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(255, 150, 200, 0.9))
            drop-shadow(0 0 28px rgba(255, 20, 147, 0.55));
    font-style: italic;
  }

  .message .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(60px) scale(0.3) rotate(-25deg);
  }

  .message.show .letter {
    animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
               glowPulse 2s ease-in-out infinite alternate;
  }

  @keyframes popIn {
    0% {
      opacity: 0;
      transform: translateY(60px) scale(0.3) rotate(-25deg);
    }
    60% {
      opacity: 1;
      transform: translateY(-12px) scale(1.15) rotate(8deg);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(0deg);
    }
  }

  @keyframes glowPulse {
    from {
      filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.8));
    }
    to {
      filter: drop-shadow(0 0 25px rgba(255, 20, 147, 1));
    }
  }

  /* пульсирующее сердце */
  .pulse-heart {
    display: inline-block;
    animation: heartbeat 1.2s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.3); }
    50% { transform: scale(1); }
    75% { transform: scale(1.2); }
  }

  .glow-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    border: 3px solid rgba(255, 105, 180, 0.8);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .glow-ring.expand {
    animation: ringExpand 1.5s ease-out forwards;
  }

  @keyframes ringExpand {
    0% {
      width: 0;
      height: 0;
      opacity: 1;
      border-width: 6px;
    }
    100% {
      width: 150vw;
      height: 150vw;
      opacity: 0;
      border-width: 1px;
    }
  }
</style>
</head>
<body>

  <div class="messages">
    <div id="message1" class="message"></div>
    <div id="message2" class="message"></div>
  </div>

  <button id="loveBtn">нажми меня 💗</button>

<script>
  // ------- фоновые сердечки -------
  const heartSymbols = ['❤', '💖', '💕', '💗', '💓', '💘'];
  function createHeart() {
    const h = document.createElement('div');
    h.classList.add('heart-bg');
    h.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (14 + Math.random() * 26) + 'px';
    h.style.animationDuration = (6 + Math.random() * 8) + 's';
    h.style.animationDelay = Math.random() * 5 + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 15000);
  }
  setInterval(createHeart, 350);
  for (let i = 0; i < 15; i++) createHeart();

  // ------- логика -------
  const btn = document.getElementById('loveBtn');
  const message1 = document.getElementById('message1');
  const message2 = document.getElementById('message2');

  const text1 = 'дашенька, я люблю тебя! ';
  const text2 = 'спасибо за то, что ты у меня есть, люблюю кисунь ';

  // функция «оживления» букв
  function animateText(el, text, startDelay = 0) {
    el.innerHTML = '';
    const chars = text.split('');
    const step = 0.08; // задержка между буквами
    chars.forEach((ch, i) => {
      const span = document.createElement('span');
      span.classList.add('letter');
      if (ch === ' ') {
        span.innerHTML = '&nbsp;';
      } else {
        span.textContent = ch;
      }
      span.style.animationDelay = (startDelay + i * step) + 's';
      el.appendChild(span);
    });

    // пульсирующее сердечко в конце
    const heart = document.createElement('span');
    heart.classList.add('letter');
    heart.style.animationDelay = (startDelay + chars.length * step) + 's';
    heart.innerHTML = '<span class="pulse-heart">❤</span>';
    el.appendChild(heart);

    // общая длительность анимации (в мс)
    return (startDelay + chars.length * step + 0.6) * 1000;
  }

  btn.addEventListener('click', () => {
    // скрываем кнопку
    btn.classList.add('hidden');

    // сброс обеих надписей
    message1.classList.remove('show');
    message2.classList.remove('show');
    void message1.offsetWidth;
    void message2.offsetWidth;

    // волна-кольцо
    const ring = document.createElement('div');
    ring.classList.add('glow-ring', 'expand');
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 1600);

    // первая надпись
    const duration1 = animateText(message1, text1, 0);
    message1.classList.add('show');

    // вторая надпись — стартует, когда первая уже почти дописалась
    setTimeout(() => {
      animateText(message2, text2, 0);
      message2.classList.add('show');
    }, duration1 + 300);

    // возвращаем кнопку чуть позже
    setTimeout(() => {
      btn.textContent = 'ещё раз 💞';
      btn.classList.remove('hidden');
    }, duration1 + 300 + 4000);
  });
</script>

</body>
</html>
